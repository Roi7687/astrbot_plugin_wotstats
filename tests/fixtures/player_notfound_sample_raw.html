<script type="text/javascript">
	var fDialog = new FDialog({
		text:'这个功能仅供月卡用户在盒子使用，如需进一步了解可查看功能详解。',
		center:true,

	    function screenshot() {
	        $('.share').removeClass('hover');
	        setTimeout(function() {
	            window.location.href='wotboxphoto://_zzz_nonexistent_qq123456_个人战绩';
	        }, 100);
	    }
		/* 刷新战力按钮 */
		$("#refresh").on("click",function(){
			var isClient = '';
			if(isClient == 0){
				fDialog.show()
				return false;
			}
			if( $('#wu_id').val() > 0 ) {
				xhr('//wotapp.ouj.com/?r=box/refreshCombat', {
					'user_id': $('#wu_id').val(),
					'player_id': $('#p_id').val(),
					'token': ''
				}, function (res) {
					if (res.code == 200) {
						setToClient('wotbox://msgboxr_' + res.msg);
					} else if(res.code == 100) {
						setToClient('wotbox://msgboxg_' + res.msg+'_https://wan.ouj.com/camouflageCard');
					}else {
						setToClient('wotbox://msgbox_' + res.msg);
					}
				});
			}else{
				setToClient('wotbox://msgbox_请先在盒子左上角登录盒子再使用（若已登陆但角色战斗力识别为“暂无”玩家请联系盒子管理同步名字）');
			}
		})

function xhr(url,data,callback){
	$.ajax({
		type:"post",
		url:url,
		async:true,
		data:data,
		dataType: 'jsonp',
		xhrFields: {
			withCredentials: true
		},
		success: callback
	});
}
function setToClient(url) {
	var a = document.createElement("a");
	a.href = url;
	a.click();
}
